```
<title>Add Student</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;

        font-family: Arial, Helvetica, sans-serif;

        color: #f8fafc;

        background:
            radial-gradient(
                circle at top left,
                #4c1d95 0%,
                transparent 35%
            ),
            radial-gradient(
                circle at bottom right,
                #075985 0%,
                transparent 35%
            ),
            #070b16;

        padding: 45px 20px;
    }

    .container {
        width: 100%;
        max-width: 760px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 40px;
        margin-bottom: 10px;

        background: linear-gradient(
            90deg,
            #a78bfa,
            #06b6d4
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .header p {
        color: #64748b;
        font-size: 14px;
    }

    .form-card {
        position: relative;
        overflow: hidden;

        padding: 35px;

        background: rgba(15, 23, 42, 0.88);

        border: 1px solid rgba(167, 139, 250, 0.25);

        border-radius: 24px;

        box-shadow:
            0 0 40px rgba(124, 58, 237, 0.12),
            inset 0 0 25px rgba(6, 182, 212, 0.03);
    }

    .form-card::before {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -90px;
        right: -70px;

        background: #06b6d4;

        filter: blur(80px);

        opacity: 0.12;
    }

    .form-group {
        position: relative;

        margin-bottom: 22px;
    }

    label {
        display: block;

        margin-bottom: 9px;

        color: #cbd5e1;

        font-size: 14px;
        font-weight: 600;
    }

    input,
    textarea,
    select {
        width: 100%;

        padding: 13px 15px;

        color: #f8fafc;

        background: rgba(30, 41, 59, 0.75);

        border: 1px solid rgba(148, 163, 184, 0.18);

        border-radius: 11px;

        outline: none;

        font-size: 14px;

        transition: 0.25s ease;
    }

    input::placeholder,
    textarea::placeholder {
        color: #64748b;
    }

    input:focus,
    textarea:focus,
    select:focus {
        border-color: #06b6d4;

        background: rgba(30, 41, 59, 0.95);

        box-shadow:
            0 0 0 3px rgba(6, 182, 212, 0.08),
            0 0 18px rgba(6, 182, 212, 0.12);
    }

    textarea {
        min-height: 110px;

        resize: vertical;
    }

    select {
        cursor: pointer;
    }

    select option {
        background: #0f172a;
        color: #f8fafc;
    }

    .required {
        color: #22d3ee;
    }

    .submit-btn {
        width: 100%;

        margin-top: 8px;

        padding: 14px 20px;

        border: none;

        border-radius: 11px;

        color: white;

        background: linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        transition: 0.3s ease;

        box-shadow:
            0 0 20px rgba(124, 58, 237, 0.2);
    }

    .submit-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 0 30px rgba(6, 182, 212, 0.3);
    }

    .back-wrapper {
        text-align: center;

        margin-top: 25px;
    }

    .back-btn {
        display: inline-block;

        padding: 11px 20px;

        color: #c4b5fd;

        text-decoration: none;

        border: 1px solid rgba(167, 139, 250, 0.3);

        border-radius: 10px;

        transition: 0.3s ease;
    }

    .back-btn:hover {
        color: white;

        border-color: #06b6d4;

        box-shadow:
            0 0 18px rgba(6, 182, 212, 0.2);

        transform: translateY(-2px);
    }

    @media (max-width: 600px) {

        body {
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
        }

        .form-card {
            padding: 25px 18px;
        }
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="header">

    <h1>Add Student</h1>

    <p>
        Create a new student profile
    </p>

</div>


<div class="form-card">

    <form method="post">

        {% csrf_token %}


        <!-- First Name -->
        <div class="form-group">

            <label for="first_name">
                First Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter first name"
                required
            >

        </div>


        <!-- Last Name -->
        <div class="form-group">

            <label for="last_name">
                Last Name
                <span class="required">*</span>
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter last name"
                required
            >

        </div>


        <!-- Date of Birth -->
        <div class="form-group">

            <label for="date_of_birth">
                Date of Birth
            </label>

            <input
                type="date"
                id="date_of_birth"
                name="date_of_birth"
            >

        </div>


        <!-- Phone -->
        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
            >

        </div>


        <!-- Address -->
        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter student address"
            ></textarea>

        </div>


        <!-- Parent -->
        <div class="form-group">

            <label for="parent">
                Parent
            </label>

            <select
                name="parent"
                id="parent"
            >

                <option value="">
                    Select Parent
                </option>

                {% for parent in parents %}

                    <option value="{{ parent.id }}">
                        {{ parent.first_name }}
                        {{ parent.last_name }}
                    </option>

                {% empty %}

                    <option value="">
                        No parents available
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- Submit -->
        <button
            type="submit"
            class="submit-btn"
        >
            + Add Student
        </button>

    </form>

</div>


<div class="back-wrapper">

    <a
        href="{% url 'student_list' %}"
        class="back-btn"
    >
        ← Back to Students
    </a>

</div>
