<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lesson Detail</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 50px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;

            font-size: 42px;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 14px;
        }

        .lesson-card {
            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 22px;

            padding: 30px;

            box-shadow:
                0 0 35px rgba(124, 58, 237, 0.15),
                0 0 60px rgba(6, 182, 212, 0.06);

            backdrop-filter: blur(12px);
        }

        .lesson-icon {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 25px;

            border-radius: 20px;

            font-size: 32px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            box-shadow:
                0 0 30px rgba(124, 58, 237, 0.3);
        }

        .details {
            display: grid;
            gap: 14px;
        }

        .detail-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            padding: 17px 20px;

            background: rgba(2, 6, 23, 0.65);

            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 14px;

            transition: 0.25s;
        }

        .detail-row:hover {
            border-color: rgba(6, 182, 212, 0.5);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.08);
        }

        .label {
            color: #94a3b8;
            font-size: 14px;
            font-weight: bold;
        }

        .value {
            color: #f8fafc;
            font-size: 15px;
            font-weight: bold;
            text-align: right;
        }

        .teacher {
            color: #c4b5fd;
        }

        .subject {
            color: #67e8f9;
        }

        .class {
            color: #a78bfa;
        }

        .day {
            color: #22d3ee;
        }

        .lesson-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 38px;
            height: 32px;

            padding: 0 10px;

            border-radius: 9px;

            color: white;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );
        }

        .created {
            color: #94a3b8;
            font-weight: normal;
        }

        .divider {
            height: 1px;
            margin: 30px 0 25px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(124, 58, 237, 0.6),
                rgba(6, 182, 212, 0.6),
                transparent
            );
        }

        .back {
            display: inline-block;

            padding: 13px 20px;

            color: #a78bfa;
            text-decoration: none;
            font-weight: bold;

            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 12px;

            transition: 0.25s;
        }

        .back:hover {
            color: #06b6d4;
            border-color: #06b6d4;

            transform: translateX(-3px);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.15);
        }

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 34px;
            }

            .lesson-card {
                padding: 20px;
            }

            .detail-row {
                align-items: flex-start;
                flex-direction: column;
                gap: 7px;
            }

            .value {
                text-align: left;
            }

            .back {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>Lesson Detail</h1>

        <p>
            Detailed information about this lesson
        </p>

    </div>

    <div class="lesson-card">

        <div class="lesson-icon">
            📚
        </div>

        <div class="details">

            <div class="detail-row">

                <span class="label">
                    Teacher
                </span>

                <span class="value teacher">
                    {{ timetable.teacher }}
                </span>

            </div>

            <div class="detail-row">

                <span class="label">
                    Subject
                </span>

                <span class="value subject">
                    {{ timetable.subject }}
                </span>

            </div>

            <div class="detail-row">

                <span class="label">
                    Class
                </span>

                <span class="value class">
                    {{ timetable.class_room }}
                </span>

            </div>

            <div class="detail-row">

                <span class="label">
                    Day
                </span>

                <span class="value day">
                    {{ timetable.get_day_display }}
                </span>

            </div>

            <div class="detail-row">

                <span class="label">
                    Lesson Number
                </span>

                <span class="value">
                    <span class="lesson-number">
                        {{ timetable.lesson_number }}
                    </span>
                </span>

            </div>

            <div class="detail-row">

                <span class="label">
                    Created
                </span>

                <span class="value created">
                    {{ timetable.created_at }}
                </span>

            </div>

        </div>

        <div class="divider"></div>

        <a
            href="{% url 'timetable_list' %}"
            class="back"
        >
            ← Back to Timetable
        </a>

    </div>

</div>

</body>

</html>
