<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Subject</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 50px 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;

            font-size: 42px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 10px;

            color: #94a3b8;
            font-size: 14px;
        }

        /* FORM CARD */

        .form-card {
            padding: 32px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 22px;

            box-shadow:
                0 0 35px rgba(124, 58, 237, 0.15),
                0 0 65px rgba(6, 182, 212, 0.06);

            backdrop-filter: blur(12px);
        }

        /* DJANGO FORM */

        form p {
            margin: 0 0 22px;
        }

        form label {
            display: block;

            margin-bottom: 9px;

            color: #c4b5fd;

            font-size: 14px;
            font-weight: bold;
        }

        form input,
        form textarea,
        form select {
            width: 100%;

            padding: 14px 16px;

            color: #f8fafc;
            background: rgba(2, 6, 23, 0.8);

            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;

            outline: none;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;

            transition: 0.25s;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            border-color: #06b6d4;

            box-shadow:
                0 0 0 3px rgba(6, 182, 212, 0.1),
                0 0 20px rgba(6, 182, 212, 0.15);
        }

        form textarea {
            min-height: 130px;
            resize: vertical;
        }

        form select option {
            background: #0f172a;
            color: #f8fafc;
        }

        /* HELP TEXT */

        form .helptext {
            display: block;

            margin-top: 7px;

            color: #64748b;

            font-size: 12px;
        }

        /* ERRORS */

        form ul.errorlist {
            margin: 0 0 8px;
            padding: 0;

            list-style: none;

            color: #fda4af;

            font-size: 13px;
        }

        /* ACTIONS */

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-top: 30px;
            padding-top: 25px;

            border-top: 1px solid rgba(148, 163, 184, 0.12);
        }

        .save-btn {
            border: none;
            border-radius: 12px;

            padding: 14px 26px;

            color: white;

            font-size: 15px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.2);
        }

        .save-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(6, 182, 212, 0.35);
        }

        .back-btn {
            display: inline-block;

            padding: 13px 20px;

            color: #a78bfa;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;

            border: 1px solid rgba(167, 139, 250, 0.3);

            border-radius: 12px;

            transition: 0.25s;
        }

        .back-btn:hover {
            color: #06b6d4;

            border-color: #06b6d4;

            transform: translateX(-3px);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.15);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 34px;
            }

            .form-card {
                padding: 22px 18px;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .save-btn,
            .back-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Add Subject
        </h1>

        <p>
            Create a new subject for your school
        </p>

    </div>


    <div class="form-card">

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}


            <div class="actions">

                <a
                    href="{% url 'subject_list' %}"
                    class="back-btn"
                >
                    ← Back to Subjects
                </a>

                <button
                    type="submit"
                    class="save-btn"
                >
                    + Save Subject
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
