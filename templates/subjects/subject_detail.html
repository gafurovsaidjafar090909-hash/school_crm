
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Subject Detail</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 50px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;

            font-size: 42px;
            font-weight: 800;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 10px;

            color: #94a3b8;
            font-size: 14px;
        }

        /* CARD */

        .subject-card {
            padding: 32px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(124, 58, 237, 0.4);
            border-radius: 22px;

            box-shadow:
                0 0 35px rgba(124, 58, 237, 0.15),
                0 0 65px rgba(6, 182, 212, 0.06);

            backdrop-filter: blur(12px);
        }

        /* SUBJECT ICON */

        .subject-icon {
            width: 75px;
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 20px;

            font-size: 34px;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            box-shadow:
                0 0 30px rgba(124, 58, 237, 0.3);
        }

        .subject-name {
            margin: 0 0 30px;

            text-align: center;

            font-size: 30px;
            font-weight: bold;

            color: #f8fafc;
        }

        /* DETAILS */

        .details {
            display: grid;
            gap: 15px;
        }

        .detail-row {
            padding: 18px 20px;

            background: rgba(2, 6, 23, 0.65);

            border: 1px solid rgba(148, 163, 184, 0.12);

            border-radius: 14px;

            transition: 0.25s;
        }

        .detail-row:hover {
            border-color: rgba(6, 182, 212, 0.5);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.08);
        }

        .label {
            display: block;

            margin-bottom: 7px;

            color: #94a3b8;

            font-size: 13px;
            font-weight: bold;

            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .value {
            color: #f8fafc;

            font-size: 16px;
            font-weight: bold;
        }

        .description {
            color: #cbd5e1;

            line-height: 1.6;
            font-weight: normal;
        }

        .created {
            color: #94a3b8;

            font-size: 14px;
            font-weight: normal;
        }

        /* DIVIDER */

        .divider {
            height: 1px;

            margin: 30px 0 25px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(124, 58, 237, 0.6),
                rgba(6, 182, 212, 0.6),
                transparent
            );
        }

        /* BACK BUTTON */

        .back-btn {
            display: inline-block;

            padding: 13px 20px;

            color: #a78bfa;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;

            border: 1px solid rgba(167, 139, 250, 0.3);

            border-radius: 12px;

            transition: 0.25s;
        }

        .back-btn:hover {
            color: #06b6d4;

            border-color: #06b6d4;

            transform: translateX(-3px);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.15);
        }

        /* MOBILE */

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 34px;
            }

            .subject-card {
                padding: 22px 18px;
            }

            .subject-name {
                font-size: 25px;
            }

            .back-btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>
            Subject Detail
        </h1>

        <p>
            Detailed information about this subject
        </p>

    </div>


    <div class="subject-card">

        <div class="subject-icon">
            📚
        </div>


        <h2 class="subject-name">
            {{ subject.name }}
        </h2>


        <div class="details">

            <div class="detail-row">

                <span class="label">
                    Name
                </span>

                <div class="value">
                    {{ subject.name }}
                </div>

            </div>


            <div class="detail-row">

                <span class="label">
                    Description
                </span>

                <div class="value description">
                    {{ subject.description|default:"Not provided" }}
                </div>

            </div>


            <div class="detail-row">

                <span class="label">
                    Created
                </span>

                <div class="value created">
                    {{ subject.created_at }}
                </div>

            </div>

        </div>


        <div class="divider"></div>


        <a
            href="{% url 'subject_list' %}"
            class="back-btn"
        >
            ← Back to Subjects
        </a>

    </div>

</div>

</body>

</html>
