```
<title>Add Parent</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        color: #f8fafc;

        background:
            radial-gradient(circle at top left, #4c1d95 0%, transparent 35%),
            radial-gradient(circle at bottom right, #075985 0%, transparent 35%),
            #070b16;

        padding: 45px 20px;
    }

    .container {
        width: 100%;
        max-width: 650px;
        margin: auto;
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        font-size: 40px;
        margin-bottom: 10px;

        background: linear-gradient(
            90deg,
            #a78bfa,
            #06b6d4
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .header p {
        color: #64748b;
        font-size: 14px;
    }

    .form-card {
        position: relative;
        overflow: hidden;

        background: rgba(15, 23, 42, 0.88);

        border: 1px solid rgba(167, 139, 250, 0.25);

        border-radius: 24px;

        padding: 35px;

        box-shadow:
            0 0 40px rgba(124, 58, 237, 0.12),
            inset 0 0 25px rgba(6, 182, 212, 0.03);
    }

    .form-card::before {
        content: "";

        position: absolute;

        width: 180px;
        height: 180px;

        top: -90px;
        right: -70px;

        background: #7c3aed;

        filter: blur(80px);

        opacity: 0.14;
    }

    .form-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .form-title .icon {
        width: 70px;
        height: 70px;

        margin: 0 auto 15px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 50%;

        font-size: 28px;

        background: linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

        box-shadow:
            0 0 25px rgba(124, 58, 237, 0.35);
    }

    .form-title h2 {
        color: #f8fafc;
        font-size: 23px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;

        margin-bottom: 8px;

        color: #c4b5fd;

        font-size: 14px;
        font-weight: bold;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;

        padding: 14px 15px;

        color: #f8fafc;

        background: rgba(30, 41, 59, 0.75);

        border: 1px solid rgba(148, 163, 184, 0.18);

        border-radius: 11px;

        outline: none;

        font-size: 15px;

        transition: 0.25s ease;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
        color: #64748b;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #06b6d4;

        box-shadow:
            0 0 0 3px rgba(6, 182, 212, 0.08),
            0 0 18px rgba(6, 182, 212, 0.12);

        background: rgba(30, 41, 59, 0.95);
    }

    .form-group textarea {
        min-height: 110px;
        resize: vertical;
    }

    .submit-btn {
        width: 100%;

        margin-top: 8px;

        padding: 14px;

        border: none;
        border-radius: 11px;

        color: white;

        font-size: 15px;
        font-weight: bold;

        cursor: pointer;

        background: linear-gradient(
            135deg,
            #7c3aed,
            #06b6d4
        );

        box-shadow:
            0 0 20px rgba(6, 182, 212, 0.2);

        transition: 0.3s ease;
    }

    .submit-btn:hover {
        transform: translateY(-2px);

        box-shadow:
            0 0 30px rgba(6, 182, 212, 0.4);
    }

    .footer {
        text-align: center;
        margin-top: 25px;
    }

    .back-btn {
        display: inline-block;

        padding: 12px 20px;

        color: #c4b5fd;

        text-decoration: none;

        border: 1px solid rgba(167, 139, 250, 0.3);

        border-radius: 10px;

        transition: 0.3s ease;
    }

    .back-btn:hover {
        color: white;

        border-color: #06b6d4;

        box-shadow:
            0 0 18px rgba(6, 182, 212, 0.2);
    }

    @media (max-width: 600px) {

        body {
            padding: 30px 15px;
        }

        .header h1 {
            font-size: 32px;
        }

        .form-card {
            padding: 25px 18px;
        }
    }
</style>
```

</head>

<body>

<div class="container">

```
<div class="header">
    <h1>Add Parent</h1>
    <p>Create a new parent profile</p>
</div>


<div class="form-card">

    <div class="form-title">

        <div class="icon">
            👨‍👩‍👧
        </div>

        <h2>Parent Information</h2>

    </div>


    <form method="post">

        {% csrf_token %}


        <div class="form-group">

            <label for="first_name">
                First Name
            </label>

            <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="Enter first name"
                required
            >

        </div>


        <div class="form-group">

            <label for="last_name">
                Last Name
            </label>

            <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="Enter last name"
                required
            >

        </div>


        <div class="form-group">

            <label for="phone">
                Phone
            </label>

            <input
                type="text"
                id="phone"
                name="phone"
                placeholder="Enter phone number"
            >

        </div>


        <div class="form-group">

            <label for="address">
                Address
            </label>

            <textarea
                id="address"
                name="address"
                rows="4"
                placeholder="Enter address"
            ></textarea>

        </div>


        <button type="submit" class="submit-btn">
            + Add Parent
        </button>

    </form>

</div>


<div class="footer">

    <a href="{% url 'parent_list' %}" class="back-btn">
        ← Back to Parents
    </a>

</div>

</div>

</body>

</html>
