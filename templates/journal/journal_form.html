```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Journal Record</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 45px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0;

            font-size: 40px;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #a78bfa,
                    #06b6d4
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin-top: 10px;

            color: #94a3b8;
            font-size: 14px;
        }

        .form-card {
            padding: 32px;

            background:
                rgba(15, 23, 42, 0.88);

            border:
                1px solid rgba(124, 58, 237, 0.35);

            border-radius: 24px;

            box-shadow:
                0 0 35px rgba(124, 58, 237, 0.12);

            backdrop-filter: blur(10px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;

            margin-bottom: 9px;

            color: #c4b5fd;

            font-size: 13px;
            font-weight: 700;

            letter-spacing: 0.5px;
        }

        select,
        input {
            width: 100%;

            padding: 14px 15px;

            color: #f8fafc;

            background:
                rgba(30, 41, 59, 0.8);

            border:
                1px solid rgba(148, 163, 184, 0.2);

            border-radius: 12px;

            outline: none;

            font-size: 14px;

            transition: 0.25s;
        }

        select:focus,
        input:focus {
            border-color: #06b6d4;

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.15);
        }

        select option {
            background: #0f172a;
            color: #f8fafc;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .save-btn {
            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border: none;
            border-radius: 13px;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 0 25px rgba(124, 58, 237, 0.2);

            transition: 0.25s;
        }

        .save-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(6, 182, 212, 0.3);
        }

        .back-wrapper {
            text-align: center;

            margin-top: 22px;
        }

        .back-btn {
            display: inline-block;

            padding: 11px 18px;

            color: #a78bfa;

            text-decoration: none;

            border:
                1px solid rgba(167, 139, 250, 0.3);

            border-radius: 11px;

            background:
                rgba(15, 23, 42, 0.65);

            transition: 0.25s;
        }

        .back-btn:hover {
            color: #06b6d4;

            border-color: #06b6d4;

            transform: translateY(-2px);
        }

        @media (max-width: 650px) {

            body {
                padding: 30px 15px;
            }

            .header h1 {
                font-size: 32px;
            }

            .form-card {
                padding: 22px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>


<body>

<div class="container">


    <div class="header">

        <h1>
            Add Journal Record
        </h1>

        <p>
            Create a new student journal record
        </p>

    </div>


    <div class="form-card">


        <form method="post">

            {% csrf_token %}


            <div class="form-grid">


                <!-- TEACHER -->

                <div class="form-group">

                    <label>
                        Teacher
                    </label>

                    <select
                        name="teacher"
                        required
                    >

                        <option value="">
                            Select Teacher
                        </option>


                        {% for teacher in teachers %}

                            <option value="{{ teacher.id }}">

                                {{ teacher.name }}
                                {{ teacher.surname }}

                            </option>

                        {% empty %}

                            <option value="">
                                No teachers available
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- STUDENT -->

                <div class="form-group">

                    <label>
                        Student
                    </label>

                    <select
                        name="student"
                        required
                    >

                        <option value="">
                            Select Student
                        </option>


                        {% for student in students %}

                            <option value="{{ student.id }}">

                                {{ student.first_name }}
                                {{ student.last_name }}

                            </option>

                        {% empty %}

                            <option value="">
                                No students available
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- SUBJECT -->

                <div class="form-group">

                    <label>
                        Subject
                    </label>

                    <select
                        name="subject"
                        required
                    >

                        <option value="">
                            Select Subject
                        </option>


                        {% for subject in subjects %}

                            <option value="{{ subject.id }}">

                                {{ subject.name }}

                            </option>

                        {% empty %}

                            <option value="">
                                No subjects available
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- CLASS -->

                <div class="form-group">

                    <label>
                        Class
                    </label>

                    <select
                        name="class_room"
                        required
                    >

                        <option value="">
                            Select Class
                        </option>


                        {% for class_room in classes %}

                            <option value="{{ class_room.id }}">

                                {{ class_room.grade }}-{{ class_room.parallel }}

                            </option>

                        {% empty %}

                            <option value="">
                                No classes available
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- DATE -->

                <div class="form-group">

                    <label>
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        required
                    >

                </div>


                <!-- SCORE -->

                <div class="form-group">

                    <label>
                        Score
                    </label>

                    <input
                        type="number"
                        name="score"
                        min="4"
                        max="10"
                        placeholder="Enter score (4-10)"
                    >

                </div>


                <!-- ATTENDANCE -->

                <div class="form-group">

                    <label>
                        Attendance
                    </label>

                    <select
                        name="attendance"
                        required
                    >

                        <option value="present">
                            Present
                        </option>

                        <option value="absent">
                            Absent
                        </option>

                    </select>

                </div>


            </div>


            <button
                type="submit"
                class="save-btn"
            >
                ✓ Save Journal Record
            </button>


        </form>


        <div class="back-wrapper">

            <a
                href="{% url 'journal_list' %}"
                class="back-btn"
            >
                ← Back to Journal
            </a>

        </div>


    </div>

</div>

</body>

</html>
```
