
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Teacher</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 50px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            margin: 0;
            font-size: 42px;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .title p {
            margin-top: 10px;
            color: #94a3b8;
            font-size: 15px;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(124, 58, 237, 0.45);
            border-radius: 22px;
            padding: 35px;

            box-shadow:
                0 0 35px rgba(124, 58, 237, 0.18),
                0 0 60px rgba(6, 182, 212, 0.08);

            backdrop-filter: blur(12px);
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #c4b5fd;
            font-size: 14px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;

            color: #f8fafc;
            background: rgba(2, 6, 23, 0.75);

            border: 1px solid rgba(148, 163, 184, 0.25);
            border-radius: 12px;

            outline: none;
            font-size: 15px;

            transition: 0.25s;
        }

        input[type="text"]:focus {
            border-color: #06b6d4;

            box-shadow:
                0 0 0 3px rgba(6, 182, 212, 0.12),
                0 0 18px rgba(6, 182, 212, 0.15);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;

            margin: 30px 0 18px;
        }

        .section-title h3 {
            margin: 0;
            font-size: 20px;
            color: #f8fafc;
        }

        .section-line {
            flex: 1;
            height: 1px;

            background: linear-gradient(
                90deg,
                rgba(124, 58, 237, 0.7),
                rgba(6, 182, 212, 0.1)
            );
        }

        .subjects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .subject-item {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 14px 16px;

            background: rgba(2, 6, 23, 0.65);
            border: 1px solid rgba(124, 58, 237, 0.25);
            border-radius: 12px;

            cursor: pointer;
            transition: 0.25s;
        }

        .subject-item:hover {
            transform: translateY(-2px);

            border-color: rgba(6, 182, 212, 0.7);

            box-shadow:
                0 0 18px rgba(6, 182, 212, 0.12);
        }

        .subject-item label {
            margin: 0;
            cursor: pointer;
            color: #e2e8f0;
            font-weight: normal;
            font-size: 15px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;

            accent-color: #7c3aed;

            cursor: pointer;
        }

        .empty {
            padding: 18px;

            text-align: center;

            color: #94a3b8;

            background: rgba(2, 6, 23, 0.5);
            border: 1px dashed rgba(148, 163, 184, 0.25);
            border-radius: 12px;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-top: 32px;
            padding-top: 25px;

            border-top: 1px solid rgba(148, 163, 184, 0.12);
        }

        .btn {
            border: none;
            border-radius: 12px;

            padding: 14px 24px;

            color: white;
            font-size: 15px;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.2);
        }

        .btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 28px rgba(6, 182, 212, 0.35);
        }

        .back {
            color: #a78bfa;
            text-decoration: none;

            padding: 12px 18px;

            border: 1px solid rgba(167, 139, 250, 0.3);
            border-radius: 10px;

            transition: 0.25s;
        }

        .back:hover {
            color: #06b6d4;
            border-color: #06b6d4;

            box-shadow:
                0 0 15px rgba(6, 182, 212, 0.15);
        }

        @media (max-width: 600px) {

            body {
                padding: 30px 15px;
            }

            .title h1 {
                font-size: 32px;
            }

            .form-card {
                padding: 25px 20px;
            }

            .subjects {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
                gap: 15px;
            }

            .btn,
            .back {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="title">
        <h1>Add Teacher</h1>
        <p>Create a new teacher profile and assign subjects</p>
    </div>

    <div class="form-card">

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label>Name</label>

                <input
                    type="text"
                    name="name"
                    placeholder="Enter teacher name"
                    required
                >

            </div>

            <div class="form-group">

                <label>Surname</label>

                <input
                    type="text"
                    name="surname"
                    placeholder="Enter teacher surname"
                    required
                >

            </div>

            <div class="form-group">

                <label>Phone</label>

                <input
                    type="text"
                    name="phone"
                    placeholder="Enter phone number"
                >

            </div>

            <div class="section-title">

                <h3>Subjects</h3>

                <div class="section-line"></div>

            </div>

            <div class="subjects">

                {% for subject in subjects %}

                    <div class="subject-item">

                        <input
                            type="checkbox"
                            name="subjects"
                            value="{{ subject.id }}"
                            id="subject_{{ subject.id }}"
                        >

                        <label for="subject_{{ subject.id }}">
                            {{ subject.name }}
                        </label>

                    </div>

                {% empty %}

                    <div class="empty">
                        No subjects yet.
                    </div>

                {% endfor %}

            </div>

            <div class="actions">

                <a
                    href="{% url 'teachers:teacher_list' %}"
                    class="back"
                >
                    ← Back to Teachers
                </a>

                <button
                    type="submit"
                    class="btn"
                >
                    + Add Teacher
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
