
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Teachers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: #f8fafc;

            background:
                radial-gradient(
                    circle at top left,
                    #4c1d95 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #075985 0%,
                    transparent 35%
                ),
                #070b16;

            padding: 50px 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            margin-bottom: 35px;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;

            background: linear-gradient(
                90deg,
                #a78bfa,
                #06b6d4
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            margin: 8px 0 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .add-btn {
            display: inline-block;

            padding: 13px 20px;

            color: white;
            text-decoration: none;
            font-weight: bold;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            border-radius: 12px;

            transition: 0.25s;

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.2);
        }

        .add-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 0 30px rgba(6, 182, 212, 0.35);
        }

        .divider {
            height: 1px;
            margin-bottom: 30px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(124, 58, 237, 0.7),
                rgba(6, 182, 212, 0.7),
                transparent
            );
        }

        .teachers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .teacher-card {
            position: relative;

            padding: 24px;

            background: rgba(15, 23, 42, 0.88);

            border: 1px solid rgba(124, 58, 237, 0.35);
            border-radius: 18px;

            box-shadow:
                0 0 25px rgba(124, 58, 237, 0.08);

            transition: 0.25s;
        }

        .teacher-card:hover {
            transform: translateY(-5px);

            border-color: rgba(6, 182, 212, 0.7);

            box-shadow:
                0 0 30px rgba(6, 182, 212, 0.15);
        }

        .teacher-link {
            display: flex;
            align-items: center;
            gap: 16px;

            color: white;
            text-decoration: none;
        }

        .avatar {
            width: 55px;
            height: 55px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 22px;
            font-weight: bold;

            color: white;

            background: linear-gradient(
                135deg,
                #7c3aed,
                #06b6d4
            );

            box-shadow:
                0 0 20px rgba(124, 58, 237, 0.3);
        }

        .teacher-info h3 {
            margin: 0 0 6px;

            font-size: 18px;
            color: #f8fafc;
        }

        .teacher-info span {
            color: #94a3b8;
            font-size: 13px;
        }

        .arrow {
            margin-left: auto;

            color: #a78bfa;
            font-size: 22px;

            transition: 0.25s;
        }

        .teacher-card:hover .arrow {
            color: #06b6d4;
            transform: translateX(5px);
        }

        .empty {
            padding: 50px 20px;

            text-align: center;

            background: rgba(15, 23, 42, 0.8);

            border: 1px dashed rgba(148, 163, 184, 0.3);
            border-radius: 18px;

            color: #94a3b8;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty p {
            margin: 0;
        }

        @media (max-width: 650px) {

            body {
                padding: 30px 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .header h1 {
                font-size: 34px;
            }

            .add-btn {
                width: 100%;
                text-align: center;
            }

            .teachers-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>Teachers</h1>

            <p>
                Manage and view all teachers
            </p>
        </div>

        <a
            href="{% url 'teachers:teacher_create' %}"
            class="add-btn"
        >
            + Add Teacher
        </a>

    </div>

    <div class="divider"></div>

    {% if teachers %}

        <div class="teachers-grid">

            {% for teacher in teachers %}

                <div class="teacher-card">

                    <a
                        href="{% url 'teachers:teacher_detail' teacher.pk %}"
                        class="teacher-link"
                    >

                        <div class="avatar">
                            {{ teacher.name|first }}
                        </div>

                        <div class="teacher-info">

                            <h3>
                                {{ teacher.name }}
                                {{ teacher.surname }}
                            </h3>

                            <span>
                                Teacher Profile
                            </span>

                        </div>

                        <div class="arrow">
                            →
                        </div>

                    </a>

                </div>

            {% endfor %}

        </div>

    {% else %}

        <div class="empty">

            <div class="empty-icon">
                👨‍🏫
            </div>

            <p>
                No teachers yet.
            </p>

        </div>

    {% endif %}

</div>

</body>

</html>
